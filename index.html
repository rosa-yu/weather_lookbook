<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="247 Daily Station weather-responsive lookbook for Seongsu, Seoul"
    />
    <title>247 Daily Station - Weather Lookbook</title>
    <link rel="preload" href="./assets/display/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/display/lookbook.mp4" as="video" type="video/mp4" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="viewport">
      <section class="display-card" aria-label="247 Daily Station weather lookbook">
        <header class="brand-header">
          <div class="brand-lockup">
            <img src="./assets/display/247-logo.png" alt="247" />
            <p>DAILY STATION</p>
          </div>
          <p class="location">SEOUL &middot; KR</p>
        </header>

        <div class="rule"></div>

        <section class="weather-section" aria-labelledby="weather-heading">
          <p class="section-label" id="weather-heading">TODAY'S WEATHER CONDITION</p>
          <div class="date-time">
            <time id="dateText">----</time>
            <time id="timeText">--:--:--</time>
          </div>
          <div class="weather-main">
            <div class="weather-icon" id="weatherIcon" aria-hidden="true"></div>
            <div class="weather-reading">
              <p class="temperature"><span id="temperature">--</span><span>&deg;C</span></p>
              <p class="condition" id="conditionLabel">Loading</p>
            </div>
          </div>
        </section>

        <div class="rule weather-rule"></div>

        <section class="lookbook-section" aria-labelledby="lookbook-heading">
          <div class="lookbook-heading">
            <p class="section-label" id="lookbook-heading">RECOMMENDED LOOK</p>
            <p id="lookTitle">KOMATSU Pants + Light Shirt</p>
          </div>
          <div class="lookbook-media">
            <div class="video-clip">
              <video
                id="lookbookVideo"
                src="./assets/display/lookbook.mp4"
                autoplay
                muted
                playsinline
                preload="auto"
                aria-label="247 weather-responsive lookbook"
              ></video>
            </div>
          </div>
        </section>

        <footer class="display-footer">
          <p>247 DAILY STATION &mdash; WEATHER-RESPONSIVE LOOKBOOK</p>
          <div class="condition-switcher" id="conditionSwitcher" aria-label="Preview weather conditions"></div>
        </footer>
        <p class="visually-hidden" id="statusMessage" aria-live="polite">Loading weather.</p>
      </section>
    </main>

    <script src="./src/runtime-config.js"></script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
