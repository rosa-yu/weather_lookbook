name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main", "work"]
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "GitHub Environment used for test deployment"
        required: false
        type: environment
      test_temperature:
        description: "Test temperature (C); otherwise use TEST_TEMPERATURE"
        required: false
        type: string
      test_precipitation:
        description: "Test precipitation: none, rain, or snow"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: ${{ inputs.deploy_environment || 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard GitHub Environment test mode
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.test_temperature != '' || inputs.test_precipitation != '') }}
        run: |
          if [ "${{ vars.ENABLE_WEATHER_TEST_MODE }}" != "true" ]; then
            echo "Set ENABLE_WEATHER_TEST_MODE=true in the selected GitHub Environment to use test values."
            exit 1
          fi

      - name: Generate weather test override
        if: ${{ github.event_name == 'workflow_dispatch' && vars.ENABLE_WEATHER_TEST_MODE == 'true' }}
        env:
          INPUT_TEMPERATURE: ${{ inputs.test_temperature }}
          INPUT_PRECIPITATION: ${{ inputs.test_precipitation }}
          ENV_TEMPERATURE: ${{ vars.TEST_TEMPERATURE }}
          ENV_PRECIPITATION: ${{ vars.TEST_PRECIPITATION_TYPE }}
          ENV_HUMIDITY: ${{ vars.TEST_HUMIDITY }}
        run: |
          TEMPERATURE="${INPUT_TEMPERATURE:-$ENV_TEMPERATURE}"
          PRECIPITATION="${INPUT_PRECIPITATION:-$ENV_PRECIPITATION}"
          HUMIDITY="${ENV_HUMIDITY:-55}"

          if [ -z "$TEMPERATURE" ] || [ -z "$PRECIPITATION" ]; then
            echo "Set TEST_TEMPERATURE and TEST_PRECIPITATION_TYPE, or enter workflow_dispatch values."
            exit 1
          fi

          case "$PRECIPITATION" in
            none|rain|snow) ;;
            *) echo "TEST_PRECIPITATION_TYPE must be none, rain, or snow."; exit 1 ;;
          esac

          TEMPERATURE="$TEMPERATURE" node -e "const n=Number(process.env.TEMPERATURE); if (!Number.isFinite(n)) process.exit(1)" || {
            echo "TEST_TEMPERATURE must be numeric."
            exit 1
          }

          HUMIDITY="$HUMIDITY" node -e "const n=Number(process.env.HUMIDITY); if (!Number.isFinite(n)) process.exit(1)" || {
            echo "TEST_HUMIDITY must be numeric."
            exit 1
          }

          cat > src/runtime-config.js <<EOF_CONFIG
          window.__WEATHER_LOOKBOOK_OVERRIDE__ = {
            enabled: true,
            temperature: Number(${TEMPERATURE}),
            humidity: Number(${HUMIDITY}),
            precipitationType: "${PRECIPITATION}",
            baseTime: "1200",
          };
          EOF_CONFIG

      - name: Fetch KMA weather with repository secrets
        if: ${{ github.event_name != 'workflow_dispatch' || vars.ENABLE_WEATHER_TEST_MODE != 'true' }}
        env:
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          WEATHER_SECRET_KEY: ${{ secrets.WEATHER_SECRET_KEY }}
        run: |
          if [ -n "$KMA_APIHUB_KEY" ]; then
            node scripts/fetch-weather-apihub.mjs || {
              if [ -z "$WEATHER_SECRET_KEY" ]; then
                exit 1
              fi
              echo "::warning::APIHub collection failed. Falling back to the hourly public-data API."
              node scripts/fetch-weather.mjs
            }
          elif [ -n "$WEATHER_SECRET_KEY" ]; then
            node scripts/fetch-weather.mjs
          else
            echo "::warning::No KMA secret is configured. Deploying the committed fallback weather.json."
          fi

      - name: Build lookbook video manifest
        run: node scripts/build-lookbook-manifest.mjs

      - name: Test lookbook schedule and shuffle cycle
        run: node --test tests/lookbook-engine.test.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
